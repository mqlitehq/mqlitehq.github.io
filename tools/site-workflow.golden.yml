name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Detect canonical-source drift even when this repository has no new commit.
  # Scheduled checks are read-only and never publish; scheduling may be delayed.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  anti-rot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out mqlite (canonical docs)
        uses: actions/checkout@v7
        with:
          repository: mqlitehq/mqlite
          ref: main
          path: mqlite-src
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - name: Check out mqlite-go (companion contract)
        uses: actions/checkout@v7
        with:
          repository: mqlitehq/mqlite-go
          ref: main
          path: mqlite-go-src
          persist-credentials: false
      - name: Install generator dependencies
        working-directory: tools
        run: npm ci
      - name: Use the official Ubuntu archive for browser dependencies
        run: |
          apt_sources_file=/etc/apt/sources.list.d/ubuntu.sources
          grep -Fxq 'URIs: mirror+file:/etc/apt/apt-mirrors.txt' "$apt_sources_file"
          sudo sed -i 's|^URIs: mirror+file:/etc/apt/apt-mirrors\.txt$|URIs: https://archive.ubuntu.com/ubuntu/|' "$apt_sources_file"
          grep -Fxq 'URIs: https://archive.ubuntu.com/ubuntu/' "$apt_sources_file"
      - name: Install Chromium for browser checks
        working-directory: tools
        run: npx playwright install --with-deps chromium
      - name: Audit every public file and version reference
        working-directory: tools
        run: node site-audit.mjs ../mqlite-src --sdk ../mqlite-go-src --report "$RUNNER_TEMP/site-audit.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Test generation and rejection contracts
        working-directory: tools
        run: node --test *.test.mjs
      - name: Test navigation, bilingual pages and the demo
        working-directory: tools
        run: npx playwright test --config playwright.config.mjs
      - name: Verify every generated output and source-derived claim
        working-directory: tools
        run: node build.mjs ../mqlite-src --check
      - name: Package the public static site
        run: sh tools/package-site.sh _site
      - name: Upload the checked site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Upload the documentation audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-audit
          path: ${{ runner.temp }}/site-audit.json
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: anti-rot
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy the checked site
        id: deployment
        uses: actions/deploy-pages@v5
