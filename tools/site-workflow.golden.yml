name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Detect canonical-source drift even when this repository has no new commit.
  # Scheduled checks are read-only and never publish; scheduling may be delayed.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  anti-rot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out mqlite (canonical docs)
        uses: actions/checkout@v7
        with:
          repository: mqlitehq/mqlite
          ref: main
          path: mqlite-src
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          package-manager-cache: false
      - name: Install generator dependencies
        working-directory: tools
        run: npm ci
      - name: Install Chromium for browser checks
        working-directory: tools
        run: npx playwright install --with-deps chromium
      - name: Test generation and rejection contracts
        working-directory: tools
        run: node --test *.test.mjs
      - name: Test navigation, bilingual pages and the demo
        working-directory: tools
        run: npx playwright test --config playwright.config.mjs
      - name: Verify every generated output and source-derived claim
        working-directory: tools
        run: node build.mjs ../mqlite-src --check
      - name: Package the public static site
        run: sh tools/package-site.sh _site
      - name: Upload the checked site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: anti-rot
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy the checked site
        id: deployment
        uses: actions/deploy-pages@v5
