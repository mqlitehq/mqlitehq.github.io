<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 935 380" role="img" aria-label="Two delivery targets: send straight to a queue, or publish to a topic that fans out to subscription queues" font-family="ui-monospace, SF Mono, Menlo, Consolas, monospace">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7a786f"/>
    </marker>
  </defs>

  <!-- ── A · direct to a queue ─────────────────────────────────────────── -->
  <text x="30" y="20" font-size="13" font-weight="600" fill="#f2f1ea">A · send straight to a queue</text>

  <rect x="40" y="40" width="170" height="32" rx="6" fill="#1f1f1d" stroke="#4a4946" stroke-width="1.5"/>
  <text x="125" y="56" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#f2f1ea">producer</text>

  <line x1="125" y1="72" x2="125" y2="98" stroke="#7a786f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="132" y="85" font-size="10" dominant-baseline="central" fill="#98968c">send "orders"</text>

  <rect x="30" y="104" width="190" height="128" rx="6" fill="none" stroke="#4a4946" stroke-width="1.5"/>
  <text x="125" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#f2f1ea">queue · orders</text>

  <rect x="45" y="132" width="160" height="30" rx="6" fill="rgba(52,211,153,0.10)" stroke="#34d399" stroke-width="1.5"/>
  <text x="125" y="147" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#f2f1ea">active</text>

  <line x1="125" y1="162" x2="125" y2="176" stroke="#7a786f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="132" y="169" font-size="10" dominant-baseline="central" fill="#98968c">claim</text>

  <rect x="45" y="178" width="160" height="30" rx="6" fill="rgba(227,179,65,0.10)" stroke="#e3b341" stroke-width="1.5"/>
  <text x="125" y="193" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#f2f1ea">locked (in-flight)</text>

  <line x1="125" y1="232" x2="125" y2="262" stroke="#7a786f" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="132" y="247" font-size="10" dominant-baseline="central" fill="#98968c">receive + complete</text>

  <rect x="40" y="264" width="170" height="32" rx="6" fill="#1f1f1d" stroke="#4a4946" stroke-width="1.5"/>
  <text x="125" y="280" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#f2f1ea">consumer</text>

  <!-- failure side-loop: DLQ, closed back via redrive / out via purge -->
  <line x1="205" y1="188" x2="270" y2="182" stroke="#7a786f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="237" y="172" text-anchor="middle" font-size="10" fill="#98968c">on failure</text>
  <rect x="270" y="160" width="152" height="36" rx="6" fill="rgba(230,103,103,0.10)" stroke="#e66767" stroke-width="1.5"/>
  <text x="346" y="178" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#f2f1ea">dead-letter (DLQ)</text>
  <path d="M 346 160 L 346 147 L 207 147" fill="none" stroke="#7a786f" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="290" y="138" text-anchor="middle" font-size="10" fill="#98968c">redrive ↺ (to active)</text>
  <text x="346" y="212" text-anchor="middle" font-size="10" fill="#98968c">…or purge ✗</text>

  <!-- ── B · publish to a topic, fan out ───────────────────────────────── -->
  <text x="410" y="20" font-size="13" font-weight="600" fill="#f2f1ea">B · publish to a topic — fan out</text>

  <g transform="translate(50,24)">
    <rect x="500" y="40" width="160" height="32" rx="6" fill="#1f1f1d" stroke="#4a4946" stroke-width="1.5"/>
    <text x="580" y="56" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#f2f1ea">producer</text>

    <line x1="580" y1="72" x2="580" y2="98" stroke="#7a786f" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="587" y="85" font-size="10" dominant-baseline="central" fill="#98968c">publish "events"</text>

    <rect x="440" y="104" width="290" height="50" rx="6" fill="rgba(250,204,21,0.07)" stroke="#facc15" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="585" y="122" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#f2f1ea">topic · events</text>
    <text x="585" y="138" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#98968c">routing rule — stores nothing</text>

    <line x1="500" y1="154" x2="465" y2="198" stroke="#7a786f" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="480" y="172" text-anchor="end" font-size="10" dominant-baseline="central" fill="#98968c">match</text>
    <line x1="650" y1="154" x2="668" y2="196" stroke="#7a786f" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="668" y="172" font-size="10" dominant-baseline="central" fill="#98968c">match</text>
    <line x1="715" y1="154" x2="798" y2="192" stroke="#7a786f" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="386" y="198" width="158" height="64" rx="6" fill="#1f1f1d" stroke="#4a4946" stroke-width="1.5"/>
    <text x="465" y="215" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#f2f1ea">sub · audit</text>
    <text x="465" y="230" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#98968c">backing queue</text>
    <text x="465" y="245" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#98968c">= a queue · own DLQ</text>

    <rect x="591" y="198" width="158" height="64" rx="6" fill="#1f1f1d" stroke="#4a4946" stroke-width="1.5"/>
    <text x="670" y="215" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#f2f1ea">sub · billing</text>
    <text x="670" y="230" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#98968c">backing queue</text>
    <text x="670" y="245" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#98968c">= a queue · own DLQ</text>

    <text x="808" y="208" text-anchor="middle" font-size="18" fill="#e66767">✗</text>
    <text x="808" y="228" text-anchor="middle" font-size="10" fill="#e66767">no match</text>
    <text x="808" y="241" text-anchor="middle" font-size="10" fill="#e66767">dropped (no copy)</text>

    <line x1="465" y1="262" x2="465" y2="292" stroke="#7a786f" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="472" y="277" font-size="10" dominant-baseline="central" fill="#98968c">receive</text>
    <line x1="670" y1="262" x2="670" y2="292" stroke="#7a786f" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="677" y="277" font-size="10" dominant-baseline="central" fill="#98968c">receive</text>

    <rect x="386" y="294" width="158" height="32" rx="6" fill="#1f1f1d" stroke="#4a4946" stroke-width="1.5"/>
    <text x="465" y="310" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#f2f1ea">consumer</text>
    <rect x="591" y="294" width="158" height="32" rx="6" fill="#1f1f1d" stroke="#4a4946" stroke-width="1.5"/>
    <text x="670" y="310" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#f2f1ea">consumer</text>
  </g>
</svg>
